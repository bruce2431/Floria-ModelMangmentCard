<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型</title>
<script>
  // 与宿主同源：读同一份 localStorage 主题；storage 事件让宿主切主题时本页同步。
  (function () {
    function apply(v) {
      if (v !== 'dark' && v !== 'light') v = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = v
    }
    var t = null
    try { t = localStorage.getItem('floria-theme') } catch (e) { /* 存储不可用则跟随系统 */ }
    apply(t)
    addEventListener('storage', function (e) {
      if (e.key !== 'floria-theme') return
      apply(e.newValue)
      if (window.__modelsReRender) window.__modelsReRender()
    })
  })()
</script>
<link rel="stylesheet" href="/webui/floria-web.css?v=2">
<script src="/webui/floria-web.iife.js?v=2"></script>
<style>
  html, body { margin: 0; }
  html { background: var(--bg); height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; padding: 20px 22px 34px; min-height: 100%; overflow-x: clip; -webkit-overflow-scrolling: touch; }
  /* 卡内独立文档：补一条按钮 reset（floria-web.css 只出令牌与结构，按钮外观由业务类给） */
  button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #111; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80vw; z-index: 40; }
  .toast.on { opacity: .94; }
  .toast.err { background: var(--danger-fg); }
  /* 详情页内的模型区（卡体 + 工具栏） */
  .model-sec { margin-top: 24px; }
  .model-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .model-bar .mgr-search { margin-bottom: 0; flex: 1 1 200px; max-width: 340px; }
  .model-bar .mgr-retry { margin-top: 0; margin-left: auto; }
  .model-sec .mgr-grid { margin-top: 0; }
  .model-sec .mgr-name { font-family: var(--mono); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .model-sec .mgr-desc { margin-top: 3px; }
  .cat-note { margin: 0 0 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--hover); font-size: 12px; color: var(--text-2); }
  .cat-note.warn { color: var(--warn-fg); border-color: var(--warn-line); background: var(--warn-bg); }
  .model-add { display: flex; gap: 8px; margin-top: 14px; }
  .model-add input { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 9px 16px; outline: none; }
  .model-add input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(77, 107, 254, .12); }
  .model-add .mgr-cat { padding: 7px 18px; }
  /* 新增供应商弹窗 */
  .mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .42); display: none; align-items: center; justify-content: center; padding: 22px; z-index: 20; }
  .mask.on { display: flex; }
  .modal { width: min(520px, 100%); max-height: 88vh; overflow: auto; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px 20px 18px; box-shadow: var(--shadow); }
  .modal h2 { margin: 0 0 12px; font-size: 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12.5px; color: var(--text-2); }
  .field input, .field select, .field textarea { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; outline: none; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); }
  .field textarea { min-height: 74px; resize: vertical; font-family: var(--mono); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal .foot-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .btn { font: inherit; font-size: 13px; padding: 7px 16px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text); cursor: pointer; transition: border-color .15s, color .15s; }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  /* 包内窄屏默认隐藏 .mgr-acts；本卡只有这一处「新增供应商」入口，保持可见 */
  @media (max-width: 720px) { .mgr-acts { display: flex; } }
</style>

  <div id="app"><div class="mgr-empty" style="padding:48px 0">加载中…</div></div>

  <div class="mask" id="mask">

      <h2 id="mTitle">新增供应商</h2>
      <div class="field">
        <label for="fName">名称（providers 键名）</label>
        <input id="fName" placeholder="例如 openrouter" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="fUrl">Base URL</label>
        <input id="fUrl" placeholder="https://api.example.com/anthropic" autocomplete="off" spellcheck="false">
      </div>
      <div class="two">
        <div class="field">
          <label for="fProto">协议</label>
          <select id="fProto">
            <option value="anthropic">anthropic（Anthropic Messages）</option>
            <option value="openai-chat">openai-chat（Chat Completions）</option>
          </select>
        </div>
        <div class="field">
          <label for="fKey">API Key</label>
          <input id="fKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="field">
        <label for="fModels">启用模型（每行一个，或逗号分隔）</label>
        <textarea id="fModels" placeholder="model-a&#10;model-b"></textarea>
      </div>
      <div class="field">
        <label for="fActive">默认模型（可留空 = 第一个）</label>
        <input id="fActive" placeholder="model-a" autocomplete="off" spellcheck="false">
      </div>
      <div class="foot-actions">
        <button class="btn" id="cancelAdd">取消</button>
        <button class="btn primary" id="submitAdd">新增</button>
      </div>
    </div>
  </div>

      'M5.31 15.756c.172-3.75 1.883-5.999 2.549-6.739-3.26 2.058-5.425 5.658-6.358 8.308v1.12C1.501 21.513 4.226 24 7.59 24a6.59 6.59 0 002.2-.375c.353-.12.7-.248 1.039-.378.913-.899 1.65-1.91 2.243-2.992-4.877 2.431-7.974.072-7.763-4.5l.002.001z',

    mistral: 'M17.143 3.429v3.428h-3.429v3.429h-3.428V6.857H6.857V3.43H3.43v13.714H0v3.428h10.286v-3.428H6.857v-3.429h3.429v3.429h3.429v-3.429h3.428v3.429h-3.428v3.428H24v-3.428h-3.43V3.429z',
  }
  const BRAND_COLORS = {
    anthropic: '#d97757', openai: '#10a37f', gemini: '#4285f4', deepseek: '#4d6bfe', qwen: '#615ced',
    glm: '#3859ff', kimi: '#111111', openrouter: '#6467f2', doubao: '#325ab4', mistral: '#ff7000', other: '#6b7280',
  }
  const BRAND_TESTS = [
    ['anthropic', /anthropic|claude/i],
    ['openai', /openai|chatgpt|(^|[^a-z])gpt/i],
    ['gemini', /gemini|google|generativelanguage/i],
    ['deepseek', /deepseek/i],
    ['qwen', /qwen|dashscope|aliyun|tongyi|通义/i],
    ['glm', /glm|bigmodel|zhipu|智谱/i],
    ['kimi', /moonshot|kimi/i],
    ['openrouter', /openrouter/i],
    ['doubao', /doubao|bytedance|volc/i],
    ['mistral', /mistral/i],
  ]
  // 判据优先级 = 供应商名 → 模型名前缀 → baseUrl。不能把 baseUrl 混在一起判：
  // Gemini 的 OpenAI 兼容端点是 .../v1beta/openai，混判会把它认成 OpenAI。
  const HOST_TESTS = [
    ['anthropic', /anthropic/],
    ['gemini', /googleapis|generativelanguage|google\./],
    ['deepseek', /deepseek/],
    ['qwen', /dashscope|aliyun|qwen/],
    ['glm', /bigmodel|zhipu/],
    ['kimi', /moonshot/],
    ['openrouter', /openrouter/],
    ['doubao', /volc|bytedance/],
    ['mistral', /mistral/],
    ['openai', /openai/],
  ]
  function brandOf(name, cfg) {
    const n = String(name || '').toLowerCase()
    for (const [b, re] of BRAND_TESTS) if (re.test(n)) return b
    const models = (cfg && Array.isArray(cfg.models) ? cfg.models.join(' ') : '').toLowerCase()
    for (const [b, re] of BRAND_TESTS) if (re.test(models)) return b
    const host = String((cfg && cfg.baseUrl) || '').toLowerCase()
    for (const [b, re] of HOST_TESTS) if (re.test(host)) return b
    return 'other'
  }
  const isDark = () => document.documentElement.dataset.theme === 'dark'
  // 品牌 SVG：随主题前景色的图标块（mgr .mgr-ic.ic），颜色由内联 style 覆盖。
  function brandSvg(brand) {
    const d = ICONS[brand]
    const paths = Array.isArray(d) ? d : d ? [d] : []
    if (!paths.length) return ''
    const color = brand === 'kimi' && isDark() ? '#e8eaed' : (BRAND_COLORS[brand] || BRAND_COLORS.other)
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" style="color:' + color + '">' +
      paths.map((p) => '<path d="' + p + '"/>').join('') + '</svg>'
  }

  /* ---------- 数据 ---------- */
  let CRED = null, CRED_MTIME = 0
  let VIEW = { mode: 'grid' }
  let GRID_Q = ''
  let catalogSeq = 0

  async function readCredentials() {
    const r = await fetch(api('/gateway/file?label=' + encodeURIComponent(ROOT_LABEL) + '&path=' + encodeURIComponent(CRED_PATH)))
    if (!r.ok) throw new Error('读取凭据池失败：HTTP ' + r.status)
    const m = /"?([\d.]+)"?/.exec(r.headers.get('ETag') || '')
    CRED_MTIME = m ? Number(m[1]) : 0
    CRED = JSON.parse(await r.text())
  }
  async function load() {
    $('app').innerHTML = '<div class="mgr-empty" style="padding:48px 0">加载中…</div>'
    try {
      await readCredentials()
      GRID_Q = ''
      VIEW = { mode: 'grid' }
      render()
    } catch (e) {
      $('app').innerHTML = '<div class="mgr-empty" style="padding:48px 0">加载失败：' + esc(e.message || e) + '</div>'
    }
  }
  function providers() { return CRED && CRED.providers ? CRED.providers : {} }
  function render() { VIEW.mode === 'detail' ? renderDetail() : renderGrid() }
  window.__modelsReRender = () => { if (CRED) render() }

  /* ---------- 列表页（供应商） ---------- */
  function providerItem(name, cfg) {
    const active = CRED.activeProvider === name
    const count = Array.isArray(cfg.models) ? cfg.models.length : 0
    return {
      key: name,
      name,
      desc: count + ' 个已启用模型 · ' + (cfg.baseUrl || '—'),
      icon: brandSvg(brandOf(name, cfg)),
      color: MgrUI.color(name),
      initial: (name[0] || '?').toUpperCase(),
      action: active ? { on: true, title: '默认供应商' } : undefined,
    }
  }
  function browseItems() {
    const q = String(GRID_Q || '').trim().toLowerCase()
    const ps = providers()
    return Object.keys(ps)
      .filter((n) => !q || n.toLowerCase().includes(q) || String(ps[n].baseUrl || '').toLowerCase().includes(q))
      .map((n) => providerItem(n, ps[n]))
  }
  function renderGrid() {
    MgrUI.browse($('app'), {
      title: '模型',
      search: { placeholder: '搜索供应商…', value: GRID_Q },
      actionsHtml: '<button class="mgr-act" data-act="refresh" title="刷新">' + I.refresh + '</button>' +
        '<button class="mgr-act" data-act="addprov" title="新增供应商">' + I.dshPlus + '</button>',
      items: browseItems(),
      empty: '没有匹配的供应商',
      onSearch(q) { GRID_Q = q; MgrUI.grid($('app'), { items: browseItems(), empty: '没有匹配的供应商', onItem: openProvider }) },
      onItem(key) { openProvider(key) },
    })
  }

  /* ---------- 详情页（拥有 / 已启用模型） ---------- */
  function renderDetail() {
    const name = VIEW.provider
    const cfg = providers()[name]
    if (!cfg) { backToGrid(); return }
    const active = CRED.activeProvider === name
    MgrUI.detail($('app'), {
      typeLabel: '供应商',
      name,
      icon: brandSvg(brandOf(name, cfg)),
      color: MgrUI.color(name),
      initial: (name[0] || '?').toUpperCase(),
      action: active ? { on: true, title: '默认供应商' } : undefined,
      onBack() { backToGrid() },
      onMounted(host) {
        const d = host.querySelector('.mgr-dl-desc')
        if (d) d.remove()
        const sec = host.querySelector('.mgr-dl-sec')
        if (sec) sec.remove()
        mountModelSection(host)
      },
    })
    if (VIEW.restoreScroll) { window.scrollTo(0, VIEW.restoreScroll); VIEW.restoreScroll = 0 }
  }

  function mountModelSection(host) {
    const pane = host.querySelector('.mgr-detail')
    if (!pane) return
    const sec = document.createElement('div')
    sec.className = 'model-sec'
    sec.innerHTML =
      '<div class="model-bar">' +
        '<div class="mgr-search">' + I.mag + '<input type="text" id="mSearch" placeholder="搜索模型…" autocomplete="off" spellcheck="false"></div>' +
        '<button class="mgr-retry" type="button" data-act="save">保存启用项</button>' +
      '</div>' +
      '<div class="cat-note" id="catNote" hidden></div>' +
      '<div class="mgr-grid" data-mgr-grid></div>' +
      '<div class="model-add"><input id="mAdd" placeholder="添加模型…" autocomplete="off" spellcheck="false">' +
        '<button class="mgr-cat" type="button" data-act="addmodel">添加</button></div>'
    pane.appendChild(sec)
    sec.querySelector('#mSearch').value = VIEW.q || ''
    syncNote()
    syncSelection()
    renderModelGrid(host)
  }

  function modelGridOpts() {
    const q = String(VIEW.q || '').trim().toLowerCase()
    const rows = (VIEW.catalog.models || []).filter((m) => !q || m.id.toLowerCase().includes(q) || String(m.name || '').toLowerCase().includes(q))
    return {
      items: rows.map(modelItem),
      empty: q ? '没有匹配的模型' : '暂无模型',
      onItem(key) { toggleModel(key) },
      onAction(key) { toggleModel(key) },
    }
  }
  function renderModelGrid(host) { MgrUI.grid(host || $('app'), modelGridOpts()) }

  // 模型卡：主标题 = 模型 id；副标题 = 显示名 + 识图/工具绑定/已启用 标签；动作位 = + / ✓。
  function modelItem(m) {
    const on = VIEW.selected.has(m.id)
    const tags = []
    if (m.vision) tags.push('识图')
    if (m.tool) tags.push('工具绑定')
    if (on) tags.push('已启用')
    return {
      key: m.id,
      name: m.id,
      desc: (m.name ? m.name + ' · ' : '') + (tags.join(' · ') || '—'),
      color: MgrUI.color(m.id),
      initial: (m.id[0] || '?').toUpperCase(),
      action: { on, key: m.id, title: on ? '已启用（点击停用）' : '未启用（点击启用）' },
    }
  }

  function syncSelection() {
    const save = document.querySelector('[data-act="save"]')
    if (save) save.textContent = '保存启用项（' + VIEW.selected.size + '）'
  }
  function syncNote() {
    const el = $('catNote')
    if (!el) return
    if (VIEW.loading) { el.hidden = false; el.className = 'cat-note'; el.textContent = '正在向供应商拉取完整模型清单…' }
    else if (VIEW.error) { el.hidden = false; el.className = 'cat-note warn'; el.textContent = VIEW.error + '，已列出密钥池现有模型。' }
    else { el.hidden = true }
  }

  function toggleModel(id) {
    if (!VIEW.selected) return
    if (VIEW.selected.has(id)) VIEW.selected.delete(id); else VIEW.selected.add(id)
    renderModelGrid($('app'))
    syncSelection()
  }

  /* ---------- 目录拉取 ---------- */
  function friendlyError(msg) {
    const s = String(msg || '')
    if (/abort|timeout|fetch failed|connect/i.test(s)) return '供应商端点不可达或超时'
    return s || '未知错误'
  }
  async function loadCatalog(name) {
    const seq = ++catalogSeq
    VIEW.loading = true
    VIEW.error = ''
    syncNote()
    try {
      const r = await fetch(api('/gateway/models/catalog?provider=' + encodeURIComponent(name)))
      const d = await r.json().catch(() => ({}))
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status))
      if (seq !== catalogSeq || VIEW.mode !== 'detail' || VIEW.provider !== name) return
      VIEW.catalog = { models: Array.isArray(d.models) ? d.models : [], url: d.url || '' }
      VIEW.error = d.ok ? '' : friendlyError(d.error || '供应商未返回模型清单')
    } catch (e) {
      if (seq !== catalogSeq || VIEW.mode !== 'detail' || VIEW.provider !== name) return
      VIEW.error = friendlyError(e.message || e)
      VIEW.catalog = { models: Array.from(VIEW.selected).map((id) => ({ id, enabled: true })), url: '' }
    } finally {
      if (seq === catalogSeq && VIEW.mode === 'detail' && VIEW.provider === name) {
        VIEW.loading = false
        VIEW.catalog.models = mergeCatalog(VIEW.catalog.models)
        VIEW.restoreScroll = currentScroll()
        renderDetail()
      }
    }
  }
  // 已启用的模型即便目录里没有也保留在列表里（可手动关闭）
  function mergeCatalog(list) {
    const out = []
    const seen = new Set()
    for (const m of list) { if (!m || !m.id || seen.has(m.id)) continue; seen.add(m.id); out.push(m) }
    for (const id of VIEW.selected) if (!seen.has(id)) { seen.add(id); out.push({ id, enabled: true }) }
    return out
  }
  function currentScroll() { return window.scrollY || document.documentElement.scrollTop || 0 }

  /* ---------- 交互 ---------- */
  async function openProvider(name) {
    const cfg = providers()[name]
    if (!cfg) return
    const enabled = Array.isArray(cfg.models) ? cfg.models.map(String) : []
    VIEW = {
      mode: 'detail', provider: name, loading: true, error: '', q: '',
      selected: new Set(enabled),
      catalog: { models: enabled.map((id) => ({ id, enabled: true, vision: !!(cfg.modelVision && cfg.modelVision[id] === true) })), url: '' },
    }
    render()
    window.scrollTo(0, 0)
    loadCatalog(name)
  }
  function backToGrid() {
    catalogSeq++
    VIEW = { mode: 'grid' }
    render()
    window.scrollTo(0, 0)
  }

  async function saveProvider() {
    const name = VIEW.provider
    const enabled = (VIEW.catalog.models || []).map((m) => m.id).filter((id) => VIEW.selected.has(id))
    for (const id of VIEW.selected) if (!enabled.includes(id)) enabled.push(id)
    if (!enabled.length) { toast('至少启用一个模型', true); return }
    const next = JSON.parse(JSON.stringify(CRED))
    const cfg = next.providers[name]
    cfg.models = enabled
    if (!cfg.activeModel || !enabled.includes(cfg.activeModel)) cfg.activeModel = enabled[0]
    const btn = document.querySelector('[data-act="save"]')
    if (btn) { btn.disabled = true; btn.textContent = '保存中…' }
    try {
      const wr = await fetch(api('/gateway/file/write'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: ROOT_LABEL, path: CRED_PATH, content: JSON.stringify(next, null, 2), ...(CRED_MTIME ? { baseMtime: CRED_MTIME } : {}) }),
      })
      const d = await wr.json().catch(() => ({}))
      if (!wr.ok) throw new Error(d.error === 'conflict' ? '密钥池已被其它操作修改，请刷新后重试' : (d.error || ('HTTP ' + wr.status)))
      await readCredentials()
      await loadCatalog(name)
      toast('已保存 · ' + name + ' 启用 ' + enabled.length + ' 个模型')
    } catch (e) {
      toast('保存失败：' + (e.message || e), true)
      if (btn) { btn.disabled = false; btn.textContent = '保存启用项（' + VIEW.selected.size + '）' }
    }
  }

  function addManualModel() {
    const inp = $('mAdd')
    const id = (inp && inp.value || '').trim()
    if (!id) return
    if (!(VIEW.catalog.models || []).some((m) => m.id === id)) VIEW.catalog.models.push({ id })
    VIEW.selected.add(id)
    if (inp) inp.value = ''
    VIEW.q = ''
    const s = $('mSearch'); if (s) s.value = ''
    renderModelGrid($('app'))
    syncSelection()
    toast('已加入待启用：' + id)
  }

  // 事件委托：#app 常驻
  $('app').addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]')
    if (!act) return
    const a = act.dataset.act
    if (a === 'refresh') { load(); return }
    if (a === 'addprov') { openAdd(); return }
    if (VIEW.mode !== 'detail') return
    if (a === 'save') { saveProvider(); return }
    if (a === 'addmodel') { addManualModel(); return }
  })
  $('app').addEventListener('input', (e) => {
    if (e.target.id !== 'mSearch') return
    VIEW.q = e.target.value
    renderModelGrid($('app'))
  })
  $('app').addEventListener('keydown', (e) => {
    if (e.target.id === 'mAdd' && e.key === 'Enter') { e.preventDefault(); addManualModel() }
  })

  /* ---------- 新增供应商 ---------- */
  function openAdd() {
    $('fName').value = ''; $('fUrl').value = ''; $('fKey').value = ''; $('fModels').value = ''; $('fActive').value = ''; $('fProto').value = 'anthropic'
    $('mask').classList.add('on'); setTimeout(() => $('fName').focus(), 30)
  }
  function closeAdd() { $('mask').classList.remove('on') }

  async function submitAdd() {
    const name = $('fName').value.trim()
    const baseUrl = $('fUrl').value.trim()
    const protocol = $('fProto').value
    const key = $('fKey').value.trim()
    const rawModels = $('fModels').value.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean)
    const models = [...new Set(rawModels)]
    const activeModel = $('fActive').value.trim() || models[0] || ''
    if (!/^[A-Za-z0-9_-]+$/.test(name)) { toast('名称只能用字母、数字、下划线、短横线', true); return }
    if (!baseUrl || !/^https?:\/\//i.test(baseUrl)) { toast('Base URL 需以 http(s):// 开头', true); return }
    if (!key) { toast('API Key 不能为空', true); return }
    if (!models.length) { toast('至少启用一个模型（可稍后在详情页补充）', true); return }
    if (activeModel && !models.includes(activeModel)) { toast('默认模型不在启用列表里', true); return }
    if (providers()[name]) { toast('供应商「' + name + '」已存在', true); return }

    const btn = $('submitAdd'); btn.disabled = true; btn.textContent = '写入中…'
    try {
      // 写前备份当前密钥池
      const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)
      const bakName = 'credentials.json.bak-' + stamp
      const cr = await fetch(api('/gateway/file/create'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: ROOT_LABEL, path: '.claude', name: bakName, dir: false }),
      })
      if (cr.ok) {
        await fetch(api('/gateway/file/write'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label: ROOT_LABEL, path: '.claude/' + bakName, content: JSON.stringify(CRED, null, 2) }),
        })
      }
      const next = JSON.parse(JSON.stringify(CRED))
      const cfg = {
        baseUrl,
        keys: [{ value: key, exhausted: false }],
        activeKeyIndex: 0,
        models,
        activeModel,
        modelVision: {},
      }
      if (protocol !== 'anthropic') cfg.protocol = protocol
      next.providers[name] = cfg
      const wr = await fetch(api('/gateway/file/write'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: ROOT_LABEL, path: CRED_PATH, content: JSON.stringify(next, null, 2), ...(CRED_MTIME ? { baseMtime: CRED_MTIME } : {}) }),
      })
      const d = await wr.json().catch(() => ({}))
      if (!wr.ok) throw new Error(d.error === 'conflict' ? '密钥池已被其它操作修改，请刷新后重试' : (d.error || ('HTTP ' + wr.status)))
      closeAdd()
      toast('已新增供应商 ' + name)
      await load()
    } catch (e) {
      toast('新增失败：' + (e.message || e), true)
    } finally {
      btn.disabled = false; btn.textContent = '新增'
    }
  }

  $('cancelAdd').addEventListener('click', closeAdd)
  $('submitAdd').addEventListener('click', submitAdd)
  $('mask').addEventListener('click', (e) => { if (e.target === $('mask')) closeAdd() })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('mask').classList.contains('on')) closeAdd() })
  load()
</script>
</body>
</html>
